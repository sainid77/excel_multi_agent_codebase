[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-excel-agents"
version = "0.1.0"
description = "Multi-agent analysis of insurance Excel models into lineage and cloud APIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "openpyxl>=3.1.5",
  "pydantic>=2.11.0",
  "networkx>=3.4.0",
  "python-multipart>=0.0.20"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
